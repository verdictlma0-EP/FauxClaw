<!DOCTYPE html>
<html>
<head>
  <title>Fauxclaw Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', monospace; background: #011627; color: #FDFFFC; padding: 20px; }
    .container { max-width: 1400px; margin: 0 auto; }
    h1 { color: #FF6B35; margin-bottom: 10px; }
    .subtitle { color: #2EC4B6; margin-bottom: 30px; }
    .status { background: #1a2b3c; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #06D6A0; }
    .status.error { border-left-color: #E71D36; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card { background: #1a2b3c; padding: 20px; border-radius: 8px; text-align: center; }
    .card-value { font-size: 2.5em; font-weight: bold; color: #FFD166; }
    .card-label { color: #2EC4B6; margin-top: 10px; font-size: 0.9em; }
    .section { margin-bottom: 30px; }
    .section h2 { color: #FF6B35; margin-bottom: 15px; font-size: 1.3em; }
    .provider { background: #1a2b3c; padding: 15px; margin: 10px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .provider.online { border-left: 4px solid #06D6A0; }
    .provider.offline { border-left: 4px solid #E71D36; }
    .provider-name { font-weight: bold; }
    .provider-stats { font-size: 0.9em; color: #2EC4B6; }
    .badge { background: #2EC4B6; padding: 3px 8px; border-radius: 12px; font-size: 0.8em; color: #011627; }
    button { background: #FF6B35; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; margin-right: 10px; }
    button:hover { background: #E71D36; }
    pre { background: #0a1620; padding: 15px; overflow-x: auto; border-radius: 8px; font-size: 0.8em; margin-top: 20px; }
    .refresh { margin-top: 20px; }
  </style>
</head>
<body>
<div class="container">
  <h1> FAUXCLAW Dashboard</h1>
  <div class="subtitle">Real Claude. Fake Bill. – Live Metrics</div>
  
  <div class="status" id="status"> Connecting to proxy...</div>
  
  <div class="metrics">
    <div class="card"><div class="card-value" id="reqCount">--</div><div class="card-label">Total Requests</div></div>
    <div class="card"><div class="card-value" id="successRate">--</div><div class="card-label">Success Rate</div></div>
    <div class="card"><div class="card-value" id="avgLatency">--</div><div class="card-label">Avg Latency</div></div>
    <div class="card"><div class="card-value" id="uptime">--</div><div class="card-label">Uptime</div></div>
  </div>
  
  <div class="section">
    <h2>📡 Providers</h2>
    <div id="providers"></div>
  </div>
  
  <div class="refresh">
    <button onclick="fetchMetrics()"> Refresh Now</button>
    <button onclick="location.reload()"> Reload Page</button>
  </div>
  
  <details>
    <summary style="cursor: pointer; color: #2EC4B6; margin-top: 20px;"> Raw Data</summary>
    <pre id="rawData">Loading...</pre>
  </details>
</div>

<script>
  async function fetchMetrics() {
    try {
      const res = await fetch('/metrics');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      
      document.getElementById('reqCount').innerText = data.totalRequests || 0;
      const successRate = data.totalRequests ? ((data.successfulRequests / data.totalRequests) * 100).toFixed(1) : 0;
      document.getElementById('successRate').innerText = successRate + '%';
      document.getElementById('avgLatency').innerText = (data.avgLatency || 0).toFixed(0) + 'ms';
      const uptimeSec = Math.floor((Date.now() - (data.startTime || Date.now())) / 1000);
      const uptimeStr = uptimeSec < 60 ? uptimeSec + 's' : Math.floor(uptimeSec / 60) + 'm ' + (uptimeSec % 60) + 's';
      document.getElementById('uptime').innerText = uptimeStr;
      
      const statusDiv = document.getElementById('status');
      statusDiv.innerHTML = ' Proxy is running and healthy';
      statusDiv.classList.remove('error');
      
      const providersDiv = document.getElementById('providers');
      providersDiv.innerHTML = '';
      for (const [name, stats] of Object.entries(data.providerStats || {})) {
        const isOnline = stats.successes > 0;
        providersDiv.innerHTML += `
          <div class="provider ${isOnline ? 'online' : 'offline'}">
            <div>
              <span class="provider-name">${name.toUpperCase()}</span>
              <span class="provider-stats"> | Attempts: ${stats.attempts} |  ${stats.successes} |  ${stats.failures}</span>
            </div>
            <div><span class="badge">${stats.avgLatency.toFixed(0)}ms avg</span></div>
          </div>
        `;
      }
      
      if (Object.keys(data.providerStats || {}).length === 0) {
        providersDiv.innerHTML = '<p>No provider data yet. Make some requests first.</p>';
      }
      
      document.getElementById('rawData').innerText = JSON.stringify(data, null, 2);
    } catch (err) {
      document.getElementById('status').innerHTML = ' Cannot connect to Fauxclaw proxy. Make sure fxc start is running.';
      document.getElementById('status').classList.add('error');
      document.getElementById('rawData').innerText = err.message;
    }
  }
  
  fetchMetrics();
  setInterval(fetchMetrics, 5000);
</script>
</body>
</html>
